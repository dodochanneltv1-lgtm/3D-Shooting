    function buildBallistics(id,opt={}){

    }

    function _traj(ball,elev,Z){

    }

    const _bsCache=new Map();

    async function refreshCoinBalance(){

    async function changeCoins(delta){

      if(currentUser.isGuest){
        const balance=getGuestCoinBalance(currentUser.uid),next=balance+delta;
        if(next<0){

          const balanceEl=document.getElementById('attachment-balance');if(balanceEl)balanceEl.textContent=currentUser.coins;

        const result=await runTransaction(ref(db,`users/${currentUser.uid}`),value=>{
          /* รอบแรกแคชในเครื่องมักเป็น null: ต้องคืน value เดิมเพื่อให้ Firebase ดึงค่าจริงจากเซิร์ฟเวอร์แล้วรันใหม่ (ห้าม abort ตอน null) */

          const balanceEl=document.getElementById('attachment-balance');if(balanceEl)balanceEl.textContent=currentUser.coins;
          throw new Error(`Coins ไม่เพียงพอ (มี ${currentUser.coins}, ต้องใช้ ${-delta})`);
        }

        currentUser.coins=Math.max(0,Number(result.snapshot.val()?.coins)||0);

    async function awardDeathmatchPrize(matchId,amount){

      const claimId=String(matchId||'').replace(/[.#$\/\[\]]/g,'_');

      if(currentUser.isGuest){
        const key=`ps3d_deathmatch_reward_${currentUser.uid}_${claimId}`;
        if(localStorage.getItem(key))return false;
        try{localStorage.setItem(key,'pending');await changeCoins(amount);localStorage.setItem(key,'paid');}
        catch(error){try{localStorage.removeItem(key);}catch(cleanupError){throw new Error(`${error.message}; ล้างสถานะรางวัลที่ค้างไว้ไม่สำเร็จ: ${cleanupError.message}`);}throw error;}
        return true;

      const result=await runTransaction(ref(db,`users/${currentUser.uid}`),value=>{
        if(value===null)return value;

        throw new Error('ไม่สามารถบันทึกรางวัลในบัญชีได้');
      }
      if(!account||typeof account!=='object')throw new Error('ไม่พบข้อมูลบัญชีหลังบันทึกรางวัล');

    }

    // ===== BATTLE ROYALE STORM (วงพายุหดตัว คำนวณจากเวลา+seed จึงตรงกันทุกเครื่อง) =====
    const BR_PHASES=[{hold:70,shrink:60,r:340,dps:2},{hold:55,shrink:50,r:220,dps:3},{hold:45,shrink:42,r:130,dps:5},{hold:35,shrink:35,r:65,dps:8},{hold:25,shrink:30,r:22,dps:12},{hold:15,shrink:25,r:4,dps:20}];
    function buildBrStormPlan(seed){
      const rnd=seededRandom('storm_'+seed),plan=[];
      let cx=0,cz=0,r=Math.hypot(MAP_HALF,MAP_HALF)+20,t=0;
      for(const ph of BR_PHASES){
        const ang=rnd()*Math.PI*2,off=Math.sqrt(rnd())*Math.max(0,r-ph.r)*0.7,lim=Math.max(0,MAP_HALF-ph.r*0.6);
        const nx=Math.max(-lim,Math.min(lim,cx+Math.cos(ang)*off)),nz=Math.max(-lim,Math.min(lim,cz+Math.sin(ang)*off));
        plan.push({holdEnd:t+ph.hold,end:t+ph.hold+ph.shrink,fromX:cx,fromZ:cz,fromR:r,toX:nx,toZ:nz,toR:ph.r,dps:ph.dps});
        cx=nx;cz=nz;r=ph.r;t+=ph.hold+ph.shrink;
      }
      return plan;
    }
    function getBrZone(plan,t){
      for(let i=0;i<plan.length;i++){
        const p=plan[i],prevDps=i>0?plan[i-1].dps:0;
        if(t<p.holdEnd)return{idx:i,state:'hold',cx:p.fromX,cz:p.fromZ,r:p.fromR,nx:p.toX,nz:p.toZ,nr:p.toR,left:p.holdEnd-t,dps:prevDps};
        if(t<p.end){const k=(t-p.holdEnd)/(p.end-p.holdEnd);return{idx:i,state:'shrink',cx:p.fromX+(p.toX-p.fromX)*k,cz:p.fromZ+(p.toZ-p.fromZ)*k,r:p.fromR+(p.toR-p.fromR)*k,nx:p.toX,nz:p.toZ,nr:p.toR,left:p.end-t,dps:p.dps};}
      }
      const l=plan[plan.length-1];
      return{idx:plan.length,state:'final',cx:l.toX,cz:l.toZ,r:l.toR,nx:l.toX,nz:l.toZ,nr:l.toR,left:0,dps:l.dps*1.5};
    }
    function stormVignette(){
      let el=document.getElementById('storm-vignette');
      if(!el){el=document.createElement('div');el.id='storm-vignette';el.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 180px 40px rgba(124,58,237,.75);';document.body.appendChild(el);}
      return el;
    }
    function initBrStorm(seed,startAt){
      disposeBrStorm();
      const wall=new THREE.Mesh(new THREE.CylinderGeometry(1,1,700,96,1,true),new THREE.MeshBasicMaterial({color:0x7c3aed,transparent:true,opacity:0.2,side:THREE.DoubleSide,depthWrite:false,fog:false}));
      const next=new THREE.Mesh(new THREE.CylinderGeometry(1,1,160,96,1,true),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.08,side:THREE.DoubleSide,depthWrite:false,fog:false}));
      wall.frustumCulled=false;next.frustumCulled=false;wall.position.y=250;next.position.y=60;scene.add(wall,next);
      brStorm={plan:buildBrStormPlan(seed),startAt,wall,next,zone:null,lastIdx:-2,tick:0,nav:null};
    }
    function disposeBrStorm(){
      if(brStorm){for(const m of[brStorm.wall,brStorm.next]){scene.remove(m);m.geometry.dispose();m.material.dispose();}brStorm=null;}
      const el=document.getElementById('storm-vignette');if(el)el.style.opacity=0;
    }
    function computeBrNav(x,z){
      const n=navNodes.length;if(!n)return null;
      let goal=0,bd=Infinity;for(let i=0;i<n;i++){const d=Math.hypot(navNodes[i].pos.x-x,navNodes[i].pos.z-z);if(d<bd){bd=d;goal=i;}}
      const dist=new Int32Array(n).fill(-1),queue=[goal];dist[goal]=0;
      for(let h=0;h<queue.length;h++){const cur=queue[h];for(const nb of navNodes[cur].neighbors)if(dist[nb]<0){dist[nb]=dist[cur]+1;queue.push(nb);}}
      return{dist,x,z};
    }
    function refreshBotBRModel(b){
      if(!b.brMeshDirty)return;b.brMeshDirty=false;
      if(b.modelLoaded)rebuildLoadedBotModel(b);

    }
    function brBotIgnore(b,uid){(b.brIgnore||(b.brIgnore=new Set())).add(uid);}
    function brBotLootGoal(b,now){
      if(b.brHold||b.brLootBusy)return null;
      if(now>=(b.brLootScanAt||0)){
        b.brLootScanAt=now+(b.brUnarmed?500:1400)+Math.random()*400;
        const prev=b.brLootGoal;
        b.brLootGoal=brSystem.findBotLoot(b,b.brUnarmed?130:b.outOfAmmo?80:45);
        if(b.brLootGoal&&(!prev||prev.entry.uid!==b.brLootGoal.entry.uid))b.brGoalSince=now;
      }
      const g=b.brLootGoal;
      if(g&&now-(b.brGoalSince||now)>22000){brBotIgnore(b,g.entry.uid);b.brLootGoal=null;b.brLootScanAt=0;return null;}   // เดินไปไม่ถึง → ข้ามชิ้นนี้
      return g?g.pos:null;
    }
    function brBotTryPickup(b,now){
      const g=b.brLootGoal;if(!g||b.brHold||b.brLootBusy)return;
      if(Math.hypot(g.pos.x-b.pos.x,g.pos.z-b.pos.z)>1.9||Math.abs(g.pos.y-b.pos.y)>3)return;
      const uid=g.entry.uid,res=brSystem.botPickupEntry(b,g.entry);
      b.brLootGoal=null;b.brLootScanAt=0;
      if(res&&typeof res.then==='function'){
        b.brLootBusy=true;
        res.then(ok=>{b.brLootBusy=false;if(!ok)brBotIgnore(b,uid);refreshBotBRModel(b);},()=>{b.brLootBusy=false;brBotIgnore(b,uid);});
      }else{if(!res)brBotIgnore(b,uid);refreshBotBRModel(b);}
    }
    function brBotNeedsZone(b){
      const z=brStorm?.zone;if(!z||!brStorm.nav)return false;
      const dT=Math.hypot(b.pos.x-z.nx,b.pos.z-z.nz),dC=Math.hypot(b.pos.x-z.cx,b.pos.z-z.cz);
      const urgent=z.state!=='hold'||z.left<50||dC>z.r*0.85;
      return urgent&&(dT>z.nr*0.8||dC>z.r*0.9);
    }
    function brNextNavToward(b){
      const cur=navNodes[b.navNodeIdx],nav=brStorm?.nav;
      if(!cur||!cur.neighbors.length||!nav)return pickNextNav(b);
      let best=-1,bs=Infinity;
      for(const n of cur.neighbors){
        const d=nav.dist[n],sc=(d<0?9999+Math.hypot(navNodes[n].pos.x-nav.x,navNodes[n].pos.z-nav.z)*0.01:d)+(n===b.prevNavNodeIdx?3:0)+Math.random()*0.6;
        if(sc<bs){bs=sc;best=n;}
      }
      return best<0?pickNextNav(b):best;
    }
    function brStormText(){
      const z=brStorm?.zone;if(!z)return'';
      const sec=Math.max(0,Math.ceil(z.left)),clock=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
      return z.state==='hold'?` • วงหดใน ${clock}`:z.state==='shrink'?` • วงกำลังหด ${clock}`:' • วงสุดท้าย!';
    }
    function updateBattleRoyaleStorm(dt,now){
      if(!brStorm||!isPlaying||!isOnlineBattleRoyale())return;
      const z=getBrZone(brStorm.plan,(Date.now()-brStorm.startAt)/1000);brStorm.zone=z;
      brStorm.wall.scale.set(z.r,1,z.r);brStorm.wall.position.x=z.cx;brStorm.wall.position.z=z.cz;
      brStorm.next.scale.set(z.nr,1,z.nr);brStorm.next.position.x=z.nx;brStorm.next.position.z=z.nz;brStorm.next.visible=z.state==='hold';
      if(z.idx!==brStorm.lastIdx){
        brStorm.lastIdx=z.idx;brStorm.nav=computeBrNav(z.nx,z.nz);
        if(z.idx>0&&z.idx<=brStorm.plan.length)showBanner(z.state==='final'?'วงสุดท้าย!':'วงพายุกำลังหดตัว — รีบเข้าวงสีขาว!','#a78bfa',2600);
      }
      const outside=player.alive&&Math.hypot(player.pos.x-z.cx,player.pos.z-z.cz)>z.r;

      if(isLocalSpecial()||isHost)for(const b of bots.slice())if(b.alive&&Math.hypot(b.pos.x-z.cx,b.pos.z-z.cz)>z.r)damageBot(b,dmg,'storm','วงพายุ','storm',false,down,b.pos.clone().add(new THREE.Vector3(0,1.1,0)),'torso',0.65);
    }
    function updateBattleRoyaleVehicles(dt,now){

    async function saveAttachmentChoice(event){

          const prev=d.pos.clone();d.vel.y-=18*dt;d.pos.addScaledVector(d.vel,dt);let surfaceHit=false;
          let hitBox=null,hitT=2;
          for(const box of getColliderCandidates(prev,d.pos,d.radius)){const t=intersectSegmentAABB(prev,d.pos,box);if(t!==null&&t<hitT){hitT=t;hitBox=box;}}
          if(d.pos.y<d.radius){d.pos.y=d.radius;d.vel.y=Math.max(0,Math.abs(d.vel.y)*d.bounce);d.vel.x*=d.friction;d.vel.z*=d.friction;surfaceHit=true;}
          if(hitBox){d.pos.copy(prev.lerp(d.pos,Math.max(0,hitT-0.01)));const c=d.pos;
            const faces=[[Math.abs(c.x-hitBox.minX),-1,0,0],[Math.abs(c.x-hitBox.maxX),1,0,0],[Math.abs(c.y-hitBox.minY),0,-1,0],[Math.abs(c.y-hitBox.maxY),0,1,0],[Math.abs(c.z-hitBox.minZ),0,0,-1],[Math.abs(c.z-hitBox.maxZ),0,0,1]].sort((a,b)=>a[0]-b[0])[0];
            const normal=new THREE.Vector3(faces[1],faces[2],faces[3]),vn=d.vel.dot(normal);if(vn<0)d.vel.addScaledVector(normal,-(1+d.bounce)*vn);surfaceHit=true;
          }
          if(d.casing&&surfaceHit&&!d.dropSoundPlayed){d.dropSoundPlayed=true;const snd=Math.random()<0.5?'bullet_drop_1':'bullet_drop_2';if(!SFX.playBuffer(snd,0.25,d.pos))SFX.playNoise(0.08,1700,1.3,0.07,'highpass',0,d.pos);}
          if(d.pos.y<=d.radius+0.002&&d.vel.length()<0.55){d.vel.set(0,0,0);d.settled=true;}
          d.mesh.position.copy(d.pos);d.mesh.rotation.x+=d.vel.z*dt;d.mesh.rotation.z-=d.vel.x*dt;
        }

        if(hudRefreshTimer>=0.1){updateHUD();updateScopeRangeReadout();updateSmartScopeGuidance();updateThermalScopeTargets();hudRefreshTimer%=0.1;}
        if(minimapRefreshTimer>=0.1){drawMinimap();minimapRefreshTimer%=0.1;}
      }
      if(isPlaying){updateBotProxyLod();updateShadowCasters(now);updateSunShadow(now);}
      else botProxyBody.count=botProxyHead.count=0;
      if(isPlaying||now-lastMenuRender>=100){const renderStart=performance.now();renderer.render(scene,camera);lastRenderMs=performance.now()-renderStart;lastMenuRender=now;}
    }
    animate();
  </script>
